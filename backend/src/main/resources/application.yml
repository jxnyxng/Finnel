spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  application:
    name: krw-watcher
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/krw_watcher?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:krw_watcher}
    password: ${DB_PASSWORD:krw_watcher}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  sync:
    market-data:
      enabled: ${MARKET_DATA_SYNC_ENABLED:true}
      manual-cooldown: ${MARKET_DATA_SYNC_MANUAL_COOLDOWN:15m}
      cron: ${MARKET_DATA_SYNC_CRON:0 10 9,15 * * MON-FRI}
      currency-strength-cron: ${MARKET_DATA_SYNC_CURRENCY_STRENGTH_CRON:0 10 6,7 * * SAT}
      zone: ${MARKET_DATA_SYNC_ZONE:Asia/Seoul}
      intraday-cooldown: ${MARKET_DATA_SYNC_INTRADAY_COOLDOWN:5m}
      intraday-cron: ${MARKET_DATA_SYNC_INTRADAY_CRON:30 */5 * * * *}
      intraday-backfill-session-cooldown: ${MARKET_DATA_SYNC_INTRADAY_BACKFILL_SESSION_COOLDOWN:1h}
      intraday-backfill-no-change-suspend-threshold: ${MARKET_DATA_SYNC_INTRADAY_BACKFILL_NO_CHANGE_SUSPEND_THRESHOLD:3}
      daily-backfill-cooldown: ${MARKET_DATA_SYNC_DAILY_BACKFILL_COOLDOWN:30m}
      daily-backfill-cron: ${MARKET_DATA_SYNC_DAILY_BACKFILL_CRON:0 5 8-18 * * MON-FRI}
      post-security:
        admin-token: ${SYNC_ADMIN_TOKEN:}
        allowed-internal-cidrs: ${SYNC_ALLOWED_INTERNAL_CIDRS:}
        backfill-rate-limit-cooldown: ${SYNC_BACKFILL_RATE_LIMIT_COOLDOWN:15m}
      news-cron: ${NEWS_SYNC_CRON:0 */10 * * * MON-FRI}
  external-apis:
    koreaexim:
      base-url: ${KOREAEXIM_BASE_URL:https://www.koreaexim.go.kr/site/program/financial}
      api-key: ${KOREAEXIM_API_KEY:}
    ecos:
      base-url: ${ECOS_BASE_URL:https://ecos.bok.or.kr/api}
      api-key: ${ECOS_API_KEY:}
      korean-policy-rate-stat-code: ${ECOS_KR_POLICY_RATE_STAT_CODE:722Y001}
      korean-policy-rate-item-code: ${ECOS_KR_POLICY_RATE_ITEM_CODE:0101000}
      foreign-reserves-stat-code: ${ECOS_FOREIGN_RESERVES_STAT_CODE:732Y001}
      foreign-reserves-item-code: ${ECOS_FOREIGN_RESERVES_ITEM_CODE:99}
    fred:
      base-url: ${FRED_BASE_URL:https://api.stlouisfed.org/fred}
      api-key: ${FRED_API_KEY:}
      dollar-index-series-id: ${FRED_DOLLAR_INDEX_SERIES_ID:DTWEXBGS}
      advanced-dollar-index-series-id: ${FRED_ADVANCED_DOLLAR_INDEX_SERIES_ID:DTWEXAFEGS}
      us-policy-rate-series-id: ${FRED_US_POLICY_RATE_SERIES_ID:FEDFUNDS}
      usd-krw-series-id: ${FRED_USD_KRW_SERIES_ID:DEXKOUS}
      us-ten-year-treasury-series-id: ${FRED_US_TEN_YEAR_TREASURY_SERIES_ID:DGS10}
      vix-series-id: ${FRED_VIX_SERIES_ID:VIXCLS}
      wti-oil-series-id: ${FRED_WTI_OIL_SERIES_ID:DCOILWTICO}
      credit-spread-proxy-series-id: ${FRED_CREDIT_SPREAD_PROXY_SERIES_ID:BAMLH0A0HYM2}
    twelve-data:
      base-url: ${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
      api-key: ${TWELVE_DATA_API_KEY:}
      usd-krw-symbol: ${TWELVE_DATA_USD_KRW_SYMBOL:USD/KRW}
      intraday-interval: ${TWELVE_DATA_INTRADAY_INTERVAL:1min}
      intraday-output-size: ${TWELVE_DATA_INTRADAY_OUTPUT_SIZE:5000}
    bis:
      effective-exchange-rates-bulk-url: ${BIS_EER_BULK_URL:https://data.bis.org/static/bulk/WS_EER_csv_flat.zip}
    naver:
      base-url: ${NAVER_NEWS_BASE_URL:https://openapi.naver.com}
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
    open-fiscal:
      base-url: ${OPENFISCAL_BASE_URL:https://www.openfiscaldata.go.kr}
      api-key: ${OPENFISCAL_API_KEY:}
    policy-briefing:
      base-url: ${POLICY_BRIEFING_BASE_URL:http://apis.data.go.kr}
      api-key: ${POLICY_BRIEFING_API_KEY:}
    bok:
      base-url: ${BOK_PORTAL_BASE_URL:https://www.bok.or.kr}
      mpc-minutes-path: ${BOK_MPC_MINUTES_PATH:/portal/singl/newsData/list.do?pageIndex=1&targetDepth=3&menuNo=200789}
    kasi:
      base-url: ${KASI_SPECIAL_DAY_BASE_URL:http://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService}
      api-key: ${KASI_SPECIAL_DAY_API_KEY:}
